<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation Handler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            background: linear-gradient(135deg, #0a1929 0%, #001e3c 50%, #0a1929 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
            color: white;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: rgba(15, 30, 50, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 24px 32px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #007bff 0%, #0056d6 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.05);
        }

        .refresh-indicator {
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 24px;
        }

        .files-panel {
            background: rgba(15, 30, 50, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-height: calc(100vh - 150px);
            overflow-y: auto;
        }

        .files-panel h2 {
            color: #ffffff;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .file-list {
            list-style: none;
        }

        .file-item {
            padding: 16px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .file-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(4px);
        }

        .file-item.active {
            background: rgba(79, 195, 247, 0.2);
            border-color: #4fc3f7;
        }

        .file-name {
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
            word-break: break-all;
        }

        .file-meta {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }

        .viewer-panel {
            background: rgba(15, 30, 50, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-height: calc(100vh - 150px);
            overflow-y: auto;
        }

        .viewer-panel h2 {
            color: #ffffff;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .json-viewer {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #e0e0e0;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-x: auto;
        }

        .json-viewer .json-key {
            color: #4fc3f7;
        }

        .json-viewer .json-string {
            color: #4caf50;
        }

        .json-viewer .json-number {
            color: #ff9800;
        }

        .json-viewer .json-boolean {
            color: #9c27b0;
        }

        .json-viewer .json-null {
            color: #f44336;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.6);
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #4fc3f7;
            border-radius: 50%;
            display: inline-block;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.6);
        }

        @media (max-width: 1024px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Validation Handler</h1>
            <div class="header-actions">
                <span class="refresh-indicator" id="refreshIndicator">Auto-refreshing every 5s</span>
                <button class="btn btn-primary" onclick="refreshFiles()">Refresh</button>
            </div>
        </div>

        <div class="content-grid">
            <div class="files-panel">
                <h2>Saved Files</h2>
                <div id="filesList" class="loading">
                    <span class="spinner"></span> Loading files...
                </div>
            </div>

            <div class="viewer-panel">
                <h2>JSON Content</h2>
                <div id="jsonViewer" class="empty-state">
                    <div class="empty-state-icon">📋</div>
                    <p>Select a file to view its contents</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentFileId = null;
        let refreshInterval = null;
        let lastRefresh = new Date();

        function formatJSON(json) {
            // Simple JSON syntax highlighting
            let formatted = JSON.stringify(json, null, 2);
            
            // Escape HTML first
            formatted = formatted.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            
            // Highlight keys
            formatted = formatted.replace(/"([^"]+)":/g, '<span class="json-key">"$1":</span>');
            
            // Highlight strings
            formatted = formatted.replace(/: "([^"]*)"/g, ': <span class="json-string">"$1"</span>');
            
            // Highlight numbers
            formatted = formatted.replace(/: (\d+\.?\d*)/g, ': <span class="json-number">$1</span>');
            
            // Highlight booleans
            formatted = formatted.replace(/: (true|false)/g, ': <span class="json-boolean">$1</span>');
            
            // Highlight null
            formatted = formatted.replace(/: null/g, ': <span class="json-null">null</span>');
            
            return formatted;
        }

        async function loadFiles() {
            try {
                const response = await fetch('/api/list-json-files');
                const result = await response.json();
                
                if (result.success) {
                    displayFiles(result.files);
                    lastRefresh = new Date();
                } else {
                    document.getElementById('filesList').innerHTML = 
                        '<div class="empty-state">Error loading files</div>';
                }
            } catch (error) {
                console.error('Error loading files:', error);
                document.getElementById('filesList').innerHTML = 
                    '<div class="empty-state">Error loading files</div>';
            }
        }

        function displayFiles(files) {
            const filesList = document.getElementById('filesList');
            
            if (files.length === 0) {
                filesList.innerHTML = '<div class="empty-state">No JSON files found</div>';
                return;
            }
            
            const ul = document.createElement('ul');
            ul.className = 'file-list';
            
            files.forEach(file => {
                const li = document.createElement('li');
                li.className = 'file-item';
                if (file.client_data_id === currentFileId) {
                    li.classList.add('active');
                }
                
                const updatedDate = new Date(file.updated_at);
                const dateStr = updatedDate.toLocaleString();
                
                li.innerHTML = `
                    <div class="file-name">${escapeHtml(file.filename)}</div>
                    <div class="file-meta">
                        Updated: ${dateStr}<br>
                        Size: ${(file.size / 1024).toFixed(2)} KB
                    </div>
                `;
                
                li.addEventListener('click', () => {
                    loadFile(file.client_data_id);
                    // Update active state
                    document.querySelectorAll('.file-item').forEach(item => {
                        item.classList.remove('active');
                    });
                    li.classList.add('active');
                });
                
                ul.appendChild(li);
            });
            
            filesList.innerHTML = '';
            filesList.appendChild(ul);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function loadFile(clientDataId) {
            currentFileId = clientDataId;
            const viewer = document.getElementById('jsonViewer');
            viewer.innerHTML = '<div class="loading"><span class="spinner"></span> Loading...</div>';
            
            try {
                const response = await fetch(`/api/get-json-file/${clientDataId}`);
                const result = await response.json();
                
                if (result.success) {
                    viewer.innerHTML = `<div class="json-viewer">${formatJSON(result.data)}</div>`;
                } else {
                    viewer.innerHTML = '<div class="empty-state">Error loading file</div>';
                }
            } catch (error) {
                console.error('Error loading file:', error);
                viewer.innerHTML = '<div class="empty-state">Error loading file</div>';
            }
        }

        function refreshFiles() {
            loadFiles();
            // If a file is currently selected, reload it
            if (currentFileId) {
                loadFile(currentFileId);
            }
        }

        // Auto-refresh every 5 seconds
        function startAutoRefresh() {
            refreshInterval = setInterval(() => {
                refreshFiles();
            }, 5000);
        }

        // Update refresh indicator
        setInterval(() => {
            const now = new Date();
            const secondsAgo = Math.floor((now - lastRefresh) / 1000);
            document.getElementById('refreshIndicator').textContent = 
                `Last refreshed ${secondsAgo}s ago (auto-refresh every 5s)`;
        }, 1000);

        // Initial load
        loadFiles();
        startAutoRefresh();
    </script>
</body>
</html>
