<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Client Validation — Goldman Sachs</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto','Helvetica','Arial',sans-serif;
      background:linear-gradient(135deg,#0a1929 0%,#001e3c 50%,#0a1929 100%);
      color:#eef2ff; min-height:100vh; padding:20px; background-attachment:fixed;
    }
    .wrap{max-width:1400px;margin:0 auto}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;padding:20px;background:rgba(15,23,42,.55);border:1px solid rgba(59,130,246,.25);border-radius:18px;backdrop-filter:blur(10px)}
    .brand{display:flex;gap:12px;align-items:center}
    .badge{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(145deg,#2b6cb0,#1e40af);font-weight:800}
    .card{background:rgba(15,23,42,.55);border:1px solid rgba(59,130,246,.25);border-radius:18px;padding:24px;backdrop-filter:blur(10px);margin-bottom:20px}
    .title{font-size:1.25rem;font-weight:800;color:#c7d2fe;margin-bottom:16px}
    .subtle{color:#a5b4fc;font-size:.9rem}
    .kv{display:grid;grid-template-columns: 220px 1fr; gap:12px;align-items:center;padding:12px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(148,163,184,.2);margin-top:8px}
    .kv .k{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:#9fb3ff;font-weight:600}
    .kv .v{font-weight:600;color:#e0e7ff;word-break:break-word}
    .section{margin-top:20px}
    .btn{appearance:none;border:none;border-radius:10px;padding:12px 24px;font-weight:700;cursor:pointer;transition:all .3s;font-size:.95rem}
    .btn-primary{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 4px 15px rgba(34,197,94,.4)}
    .btn-secondary{background:rgba(255,255,255,.06);color:#dbeafe;border:1px solid rgba(148,163,184,.2)}
    .btn-secondary:hover{background:rgba(255,255,255,.1)}
    .loading{text-align:center;padding:40px;color:#a5b4fc}
    .error{text-align:center;padding:40px;color:#f87171}
    pre.json{margin-top:10px;padding:16px;border-radius:12px;background:#0b1326;border:1px solid rgba(59,130,246,.25);overflow:auto;max-height:60vh;font-size:.85rem}
    .toolbar{display:flex;gap:12px;align-items:center}
    
    /* Risk Score Display */
    .risk-score-card{background:rgba(15,23,42,.7);border:2px solid rgba(220,38,38,.4);border-radius:16px;padding:24px;margin-bottom:20px;text-align:center}
    .risk-score-value{font-size:3.5rem;font-weight:800;color:#f87171;margin:10px 0;text-shadow:0 0 20px rgba(248,113,113,.5)}
    .risk-status{font-size:1.3rem;font-weight:700;color:#fecaca;margin-bottom:8px}
    .risk-category{font-size:1rem;color:#a5b4fc;margin-top:8px}
    .risk-bar{height:12px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden;margin:16px 0;position:relative}
    .risk-bar-fill{height:100%;background:linear-gradient(90deg,#ef4444,#dc2626);border-radius:999px;transition:width .5s}
    .risk-indicator{display:flex;justify-content:space-between;margin-top:8px;font-size:.85rem;color:#a5b4fc}
    
    .validation-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:20px}
    .summary-item{background:rgba(255,255,255,.03);border:1px solid rgba(148,163,184,.2);border-radius:12px;padding:16px;text-align:center}
    .summary-item .label{font-size:.8rem;color:#9fb3ff;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
    .summary-item .value{font-size:1.5rem;font-weight:700;color:#e0e7ff}
    
    .flagged-items{background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.3);border-radius:12px;padding:16px;margin-top:20px}
    .flagged-item{background:rgba(220,38,38,.15);border-left:4px solid #ef4444;padding:12px;margin:8px 0;border-radius:8px;display:flex;align-items:center;gap:12px}
    .flagged-item-icon{font-size:1.5rem}
    .flagged-item-text{flex:1;color:#fecaca;font-weight:600}
    
    .status-badge{display:inline-block;padding:6px 12px;border-radius:999px;font-weight:700;font-size:.85rem;margin-left:12px}
    .status-flagged{background:rgba(220,38,38,.2);color:#fecaca;border:1px solid rgba(220,38,38,.4)}
    .status-validated{background:rgba(34,197,94,.2);color:#86efac;border:1px solid rgba(34,197,94,.4)}
    
    /* Modal Styles */
    .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:1000}
    .modal-overlay.show{display:flex}
    .modal-content{background:rgba(15,23,42,.95);border:1px solid rgba(59,130,246,.4);border-radius:18px;padding:32px;max-width:500px;width:90%;backdrop-filter:blur(10px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
    .modal-title{font-size:1.5rem;font-weight:800;color:#c7d2fe;margin-bottom:16px}
    .modal-message{color:#a5b4fc;margin-bottom:24px;line-height:1.6}
    .modal-actions{display:flex;gap:12px;justify-content:flex-end}
    .btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
    .btn-danger:hover{transform:translateY(-2px);box-shadow:0 4px 15px rgba(239,68,68,.4)}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="header">
      <div class="brand">
        <div class="badge">GS</div>
        <div>
          <div style="font-weight:800;font-size:1.1rem">Client Validation</div>
          <div class="subtle">Review and validate client onboarding data</div>
        </div>
      </div>
      <div class="toolbar">
        <a class="btn btn-secondary" href="/employee-dashboard" style="text-decoration:none;display:inline-block;margin-right:8px">← Employee Dashboard</a>
        <a class="btn btn-secondary" href="/dashboard" style="text-decoration:none;display:inline-block;margin-right:8px">Client Dashboard</a>
        <a class="btn btn-secondary" href="/validation-handler" style="text-decoration:none;display:inline-block">Validation Handler</a>
      </div>
    </header>

    <div id="validationContent" class="loading">
      Loading client data...
    </div>
  </div>

  <!-- Confirmation Modal -->
  <div id="confirmModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-title">Confirm Flag for Review</div>
      <div class="modal-message">
        Are you sure you want to flag this client for review? This action will mark the client as requiring additional review.
      </div>
      <div class="modal-actions">
        <button id="cancelBtn" class="btn btn-secondary">Cancel</button>
        <button id="confirmBtn" class="btn btn-danger">I'm Sure</button>
      </div>
    </div>
  </div>

  <script>
    const clientId = '{{ client_id }}';
    const contentEl = document.getElementById('validationContent');

    function fmt(v){ return (v === null || v === undefined || v === '') ? '—' : v; }
    function kv(k, v){ return `<div class="kv"><div class="k">${k}</div><div class="v">${fmt(v)}</div></div>`; }

    async function loadClientData() {
      try {
        const res = await fetch(`/api/clients/${encodeURIComponent(clientId)}`);
        if (!res.ok) {
          contentEl.className = 'error';
          contentEl.innerHTML = 'Failed to load client data.';
          return;
        }

        const payload = await res.json();
        const s = payload.summary;
        const raw = payload.raw || {};
        const sd = (raw.structured_data || {});

        // Hardcoded validation results for now
        const validationResults = {
          status: 'Flagged',
          risk_score: 0.7361,
          triage: 'Fraud',
          connections: 0,
          f1_reuse_risk: 0.0000,
          f2_proxy: 0.0000,
          flagged_items: [
            'High risk score above threshold',
            'Triage category: Fraud',
            'Multiple shared identifiers detected',
            'Unusual transaction patterns'
          ]
        };

        const riskPercentage = (validationResults.risk_score * 100).toFixed(2);
        const riskColor = validationResults.risk_score > 0.7 ? '#ef4444' : validationResults.risk_score > 0.4 ? '#f59e0b' : '#22c55e';
        const statusColor = validationResults.status === 'Flagged' ? '#f87171' : '#86efac';
        const statusBg = validationResults.status === 'Flagged' ? 'rgba(220,38,38,.1)' : 'rgba(34,197,94,.1)';
        const statusBorder = validationResults.status === 'Flagged' ? 'rgba(220,38,38,.3)' : 'rgba(34,197,94,.3)';

        contentEl.className = '';
        contentEl.innerHTML = `
          <div class="card">
            <div class="title">Client Information</div>
            <div class="subtle" style="margin-bottom:16px">${s.client_data_id} • File: ${s.filename}</div>
            
            <div class="section">
              <div style="font-weight:800;margin-bottom:12px;font-size:1.1rem">${fmt(sd.legal_name) || s.filename}</div>
            </div>

            <div class="section">
              <div style="font-weight:800;margin-bottom:8px">Business Details</div>
              ${kv('Legal Name', sd.legal_name)}
              ${kv('DBA Name', sd.dba_name)}
              ${kv('Entity Type', sd.entity_type)}
              ${kv('Registration Number', sd.registration_number)}
              ${kv('Jurisdiction', sd.jurisdiction)}
            </div>

            <div class="section">
              <div style="font-weight:800;margin-bottom:8px">Contact Information</div>
              ${kv('Contact Name', sd.contact_name)}
              ${kv('Contact Email', sd.contact_email)}
              ${kv('Contact Phone', sd.contact_phone)}
            </div>
          </div>

          <div class="card" style="background:${statusBg};border-color:${statusBorder}">
            <div class="title" style="display:flex;align-items:center;justify-content:space-between">
              <span>Risk Assessment</span>
              <span class="status-badge status-${validationResults.status.toLowerCase()}">${validationResults.status}</span>
            </div>
            
            <div class="risk-score-card" style="border-color:${statusBorder}">
              <div class="risk-status">${validationResults.status.toUpperCase()}</div>
              <div class="risk-score-value" style="color:${riskColor}">${riskPercentage}%</div>
              <div class="risk-category">Risk Score: ${validationResults.risk_score.toFixed(4)}</div>
              <div class="risk-bar">
                <div class="risk-bar-fill" style="width:${riskPercentage}%;background:linear-gradient(90deg,${riskColor},${riskColor}dd)"></div>
              </div>
              <div class="risk-indicator">
                <span>Low</span>
                <span>Medium</span>
                <span>High</span>
              </div>
            </div>

            <div class="validation-summary">
              <div class="summary-item">
                <div class="label">Triage Category</div>
                <div class="value" style="color:${riskColor}">${validationResults.triage}</div>
              </div>
              <div class="summary-item">
                <div class="label">Graph Connections</div>
                <div class="value">${validationResults.connections}</div>
              </div>
              <div class="summary-item">
                <div class="label">F1 Reuse Risk</div>
                <div class="value">${validationResults.f1_reuse_risk.toFixed(4)}</div>
              </div>
              <div class="summary-item">
                <div class="label">F2 Proxy Score</div>
                <div class="value">${validationResults.f2_proxy.toFixed(4)}</div>
              </div>
            </div>

            ${validationResults.flagged_items.length > 0 ? `
            <div class="flagged-items">
              <div style="font-weight:800;margin-bottom:12px;color:#fecaca;font-size:1.1rem">⚠️ Flagged Items</div>
              ${validationResults.flagged_items.map(item => `
                <div class="flagged-item">
                  <div class="flagged-item-icon">⚠️</div>
                  <div class="flagged-item-text">${item}</div>
                </div>
              `).join('')}
            </div>
            ` : ''}
          </div>

          <div class="card">
            <div class="title">Validation Actions</div>
            <div class="subtle" style="margin-bottom:16px">Review the risk assessment above and take appropriate action</div>
            <div style="display:flex;gap:12px">
              <button class="btn btn-primary" disabled>Approve Client</button>
              <button class="btn btn-secondary" disabled>Request Additional Information</button>
              <button id="flagForReviewBtn" class="btn btn-secondary">Flag for Review</button>
            </div>
            <div class="subtle" style="margin-top:12px;font-size:.85rem">Validation functionality coming soon...</div>
          </div>
        `;
        
        // Attach event listener to the dynamically created button
        const flagBtn = document.getElementById('flagForReviewBtn');
        if (flagBtn) {
          flagBtn.addEventListener('click', showModal);
        }
      } catch (error) {
        console.error('Error loading client:', error);
        contentEl.className = 'error';
        contentEl.innerHTML = 'An error occurred while loading client data.';
      }
    }

    // Modal functionality
    const modal = document.getElementById('confirmModal');
    const confirmBtn = document.getElementById('confirmBtn');
    const cancelBtn = document.getElementById('cancelBtn');

    function showModal() {
      modal.classList.add('show');
    }

    function hideModal() {
      modal.classList.remove('show');
    }

    // Handle confirm button
    confirmBtn.addEventListener('click', () => {
      hideModal();
      // Stay on the validation page (no redirect needed)
    });

    // Handle cancel button
    cancelBtn.addEventListener('click', hideModal);

    // Close modal when clicking outside
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        hideModal();
      }
    });

    loadClientData();
  </script>
</body>
</html>
