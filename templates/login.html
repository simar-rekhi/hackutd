<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goldman Sachs Hackathon - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Updated to Auth0 SPA JS v2 (latest stable version) -->
    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            overflow: hidden;
        }

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            filter: brightness(0.6) saturate(0.9);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(173, 216, 230, 0.35) 0%, rgba(135, 206, 235, 0.35) 100%);
            z-index: -1;
        }

        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(12px);
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(59, 130, 246, 0.12), 0 0 1px rgba(173, 216, 230, 0.3);
            border: 1px solid rgba(173, 216, 230, 0.3);
            width: 100%;
            max-width: 420px;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 32px;
            height: auto;
            margin-bottom: 32px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #2563eb;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: #0369a1;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #3b82f6;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #bfdbfe;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: rgba(240, 248, 255, 0.5);
            color: #1e40af;
        }

        input:focus {
            outline: none;
            border-color: #60a5fa;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
        }

        input::placeholder {
            color: #93c5fd;
        }

        button {
            width: 100%;
            height: 40px;
            padding: 0 24px;
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.5px;
            margin-top: 8px;
            margin-bottom: 24px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .form-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #e5e7eb;
            font-size: 13px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #60a5fa;
        }

        .form-footer a {
            color: #2563eb;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .form-footer a:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }

        .gs-logo-text {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #e5e7eb;
        }

        .error-message {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        @media (max-width: 768px) {
            .login-container {
                padding: 2.5rem;
            }

            h1 {
                font-size: 22px;
            }

            label {
                font-size: 13px;
            }

            input {
                padding: 13px 14px;
                font-size: 16px;
            }

            button {
                height: 40px;
                padding: 0 20px;
                font-size: 15px;
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 1.75rem;
                border-radius: 12px;
            }

            h1 {
                font-size: 20px;
                margin-bottom: 8px;
            }

            .subtitle {
                font-size: 13px;
                margin-bottom: 24px;
            }

            .form-group {
                margin-bottom: 22px;
            }

            input {
                padding: 12px 14px;
                font-size: 16px;
            }

            button {
                height: 40px;
                padding: 0 18px;
                font-size: 15px;
                margin-bottom: 20px;
            }

            .form-footer {
                flex-direction: column;
                align-items: flex-start;
                margin-top: 20px;
                padding-top: 20px;
                gap: 12px;
            }

            .gs-logo-text {
                font-size: 11px;
                margin-top: 24px;
                padding-top: 20px;
            }
        }

        @media (max-width: 360px) {
            .login-container {
                padding: 1.5rem;
            }

            h1 {
                font-size: 18px;
            }

            .logo {
                width: 28px;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <video class="video-background" autoplay muted loop playsinline>
        <source src="/static/backgroundVid.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <div class="login-wrapper">
        <div class="login-container">
            <div style="margin-bottom: 24px;">
                <svg class="logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="32" height="32" rx="4" fill="#2563eb"/>
                    <text x="50%" y="50%" font-size="14" font-weight="bold" fill="white" text-anchor="middle" dy=".3em">GS</text>
                </svg>
            </div>

            <h1>Welcome</h1>
            <p class="subtitle">Sign in to your Goldman Sachs Hackathon account</p>

            <!-- Added error message display -->
            <div id="error-message" class="error-message"></div>

            <form id="login-form">
                <button type="button" id="login-button">Sign In</button>

                <!-- <div class="form-footer">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember" style="margin: 0; font-size: 13px; color: #6b7280;">Remember me</label>
                    </div>
                    <a href="#forgot">Forgot password?</a>
                </div> -->
            </form>

            <div class="gs-logo-text">
                <p style="font-size: 11px; color: #9ca3af; margin-bottom: 8px;">Goldman Sachs & Co. LLC</p>
                <p style="font-size: 11px; line-height: 1.4; color: #9ca3af;">
                    © 2025 Goldman Sachs. Dedicated to advancing the financial markets with integrity, innovation, and client-centered excellence.
                </p>
            </div>
        </div>
    </div>

    <script>
        let auth0Client;
        const loginButton = document.getElementById('login-button');
        const errorMessage = document.getElementById('error-message');

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 5000);
        }

        async function initAuth0() {
            try {
                console.log('[v0] Initializing Auth0...');
                
                // Check if Auth0 SDK is loaded
                if (typeof window.auth0 === 'undefined') {
                    throw new Error('Auth0 SDK failed to load from CDN');
                }

                // Create Auth0 client with v2 API
                auth0Client = await window.auth0.createAuth0Client({
                    domain: 'dev-zr25lcrbfq321v7f.us.auth0.com',
                    clientId: 'koEERgWqiyyNe3Ry1QSAbLtKyahWdg2y',
                    authorizationParams: {
                        redirect_uri: window.location.origin + '/callback'
                    },
                    cacheLocation: 'localstorage'
                });

                console.log('[v0] Auth0 client initialized successfully');

                // Handle callback if returning from Auth0
                const query = window.location.search;
                if (query.includes('code=') && query.includes('state=')) {
                    console.log('[v0] Processing Auth0 callback...');
                    try {
                        await auth0Client.handleRedirectCallback();
                        const user = await auth0Client.getUser();
                        console.log('[v0] User authenticated:', user?.email);
                        window.history.replaceState({}, document.title, '/callback');
                        window.location.href = '/dashboard';
                        return;
                    } catch (callbackError) {
                        console.error('[v0] Callback error:', callbackError);
                        showError('Authentication callback failed. Please try logging in again.');
                    }
                }

                // Check if already authenticated
                const isAuthenticated = await auth0Client.isAuthenticated();
                if (isAuthenticated) {
                    console.log('[v0] User already authenticated, redirecting to dashboard');
                    window.location.href = '/dashboard';
                    return;
                }

                // Enable login button
                loginButton.disabled = false;
                console.log('[v0] Ready for user login');

            } catch (error) {
                console.error('[v0] Auth0 initialization error:', error);
                showError('Authentication service failed to initialize. Please refresh the page.');
                loginButton.disabled = true;
            }
        }

        async function handleLogin() {
            if (!auth0Client) {
                showError('Authentication service not ready. Please refresh the page.');
                return;
            }

            try {
                loginButton.disabled = true;
                loginButton.textContent = 'Signing in...';
                
                console.log('[v0] Initiating Auth0 login...');
                await auth0Client.loginWithRedirect({
                    authorizationParams: {
                        redirect_uri: window.location.origin + '/callback'
                    }
                });
            } catch (error) {
                console.error('[v0] Login error:', error);
                showError('Login failed. Please try again.');
                loginButton.disabled = false;
                loginButton.textContent = 'Sign In';
            }
        }

        // Initialize on load
        window.addEventListener('load', () => {
            loginButton.disabled = true;
            loginButton.textContent = 'Sign Up/Login';
            initAuth0();
        });

        // Attach login handler
        loginButton.addEventListener('click', handleLogin);

        // Also handle form submission
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            handleLogin();
        });
    </script>
</body>
</html>
