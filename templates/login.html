<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goldman Sachs - Sign In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            /* Matching dark gradient background */
            background: linear-gradient(135deg, #0a1929 0%, #001e3c 50%, #0a1929 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: white;
            position: relative;
            overflow: hidden;
        }

        /* Subtle animated background effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 40%, rgba(0, 123, 255, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 70% 70%, rgba(0, 102, 204, 0.1) 0%, transparent 50%);
            pointer-events: none;
            animation: subtleShift 15s ease-in-out infinite;
        }

        @keyframes subtleShift {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }

        .auth-card {
            /* Glass morphism card effect */
            background: rgba(15, 30, 50, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            padding: 48px 40px;
            width: 100%;
            max-width: 440px;
            animation: fadeIn 0.6s ease;
            position: relative;
            z-index: 1;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #ffffff;
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }

        .gradient-text {
            /* Premium gradient text */
            background: linear-gradient(135deg, #4fc3f7 0%, #007bff 50%, #0056d6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            text-align: center;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            /* Dark themed input fields */
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            color: white;
        }

        input:focus {
            outline: none;
            border-color: #4fc3f7;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(79, 195, 247, 0.15);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .btn {
            width: 100%;
            padding: 16px;
            /* Gradient button matching home page */
            background: linear-gradient(135deg, #007bff 0%, #0056d6 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 8px;
            box-shadow: 0 10px 30px rgba(0, 123, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0, 123, 255, 0.5);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            /* Dark themed error message */
            background: rgba(220, 38, 38, 0.15);
            border: 1px solid rgba(220, 38, 38, 0.3);
            color: #ff6b6b;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .footer-link {
            text-align: center;
            margin-top: 24px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }

        .footer-link a {
            color: #4fc3f7;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            display: inline-block;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .info-text {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-top: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <h1>Welcome to <span class="gradient-text">Goldman Sachs</span></h1>
        <p class="subtitle">Vendor & Client Onboarding Portal</p>

        <div id="error-message" class="error-message"></div>

        <!-- Auth0 button and all logic remain completely intact -->
        <button id="login-btn" class="btn">
            Sign In with Auth0
        </button>

        <p class="info-text">
            New vendors will be prompted to create an account.<br>
            Existing users can sign in with their credentials.
        </p>
    </div>

    <!-- All Auth0 JavaScript logic remains exactly the same -->
    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
    <script>
        console.log("[v0] Initializing Auth0...");
        
        let auth0Client;
        const loginBtn = document.getElementById('login-btn');
        const errorMessage = document.getElementById('error-message');

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 5000);
        }

        function setLoading(isLoading) {
            loginBtn.disabled = isLoading;
            if (isLoading) {
                loginBtn.innerHTML = '<span class="spinner"></span>Signing in...';
            } else {
                loginBtn.textContent = 'Sign In with Auth0';
            }
        }

        async function initAuth0() {
            try {
                console.log("[v0] Creating Auth0 client...");
                
                auth0Client = await window.auth0.createAuth0Client({
                    domain: 'dev-zr25lcrbfq321v7f.us.auth0.com',
                    clientId: 'koEERgWqiyyNe3Ry1QSAbLtKyahWdg2y',
                    authorizationParams: {
                        redirect_uri: window.location.origin + '/dashboard'
                    },
                    cacheLocation: 'localstorage'
                });

                console.log("[v0] Auth0 client initialized successfully");

                // Check if returning from Auth0
                const query = window.location.search;
                if (query.includes('code=') && query.includes('state=')) {
                    console.log("[v0] Handling Auth0 callback...");
                    setLoading(true);
                    try {
                        await auth0Client.handleRedirectCallback();
                        console.log("[v0] Callback handled, redirecting to dashboard");
                        window.location.href = '/dashboard';
                    } catch (error) {
                        console.error('[v0] Callback error:', error);
                        showError('Authentication failed. Please try again.');
                        setLoading(false);
                    }
                    return;
                }

                // Check if already logged in
                const isAuthenticated = await auth0Client.isAuthenticated();
                console.log("[v0] Is authenticated:", isAuthenticated);
                
                if (isAuthenticated) {
                    console.log("[v0] User already authenticated, redirecting to dashboard");
                    window.location.href = '/dashboard';
                }
            } catch (error) {
                console.error('[v0] Auth0 initialization error:', error);
                showError('Authentication service unavailable. Please refresh the page.');
            }
        }

        async function handleLogin() {
            console.log("[v0] Login button clicked");
            setLoading(true);

            try {
                console.log("[v0] Redirecting to Auth0 Universal Login...");
                await auth0Client.loginWithRedirect({
                    authorizationParams: {
                        redirect_uri: window.location.origin + '/dashboard'
                    }
                });
            } catch (error) {
                console.error('[v0] Login error:', error);
                showError('Login failed. Please try again.');
                setLoading(false);
            }
        }

        loginBtn.addEventListener('click', handleLogin);
        window.addEventListener('load', initAuth0);
    </script>
</body>
</html>
