<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goldman Sachs - Sign In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            /* Matching dark gradient background */
            background: linear-gradient(135deg, #0a1929 0%, #001e3c 50%, #0a1929 100%);
            color: #e0e7ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(0,123,255,.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0,102,204,.08) 0%, transparent 50%);
            pointer-events: none;
            animation: subtleShift 20s ease-in-out infinite;
        }

        @keyframes subtleShift {
            0% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0); }
        }

        .card {
            width: 100%;
            max-width: 640px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(59, 130, 246, 0.25);
            box-shadow: 0 10px 25px rgba(2, 6, 23, 0.6), inset 0 0 80px rgba(59, 130, 246, 0.06);
            border-radius: 20px;
            padding: 28px;
            backdrop-filter: blur(10px);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 14px;
        }

        .logo {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(145deg, #2b6cb0, #1e40af);
            display: grid;
            place-items: center;
            color: white;
            font-weight: 700;
        }

        h1 {
            font-size: 1.5rem;
            line-height: 1.2;
        }

        p.sub {
            color: #9fb3ff;
            margin-bottom: 18px;
        }

        .glass {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 16px;
            padding: 18px;
        }

        .cta {
            display: flex;
            gap: 12px;
            margin-top: 14px;
        }

        .btn {
            appearance: none;
            border: none;
            border-radius: 12px;
            padding: 12px 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 120ms ease, box-shadow 200ms ease, background 200ms ease;
            will-change: transform;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.35), inset 0 0 0 1px rgba(255,255,255,0.06);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(37, 99, 235, 0.45);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.06);
            color: #dbeafe;
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.08);
            transform: translateY(-1px);
        }

        .loading {
            display: none;
            margin-top: 14px;
            font-size: 0.95rem;
            color: #bfdbfe;
        }

        .error-message {
            background: rgba(220, 38, 38, 0.15);
            border: 1px solid rgba(220, 38, 38, 0.3);
            color: #fecaca;
            padding: 12px 14px;
            border-radius: 12px;
            margin-top: 14px;
            display: none;
        }

        .footer {
            margin-top: 18px;
            color: #a5b4fc;
            font-size: 0.9rem;
        }

        .hint {
            color: #93c5fd;
            font-size: 0.95rem;
            margin-top: 12px;
        }

        .list {
            margin-top: 10px;
            padding-left: 18px;
            color: #c7d2fe;
        }

        .list li { margin: 6px 0; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="logo">GS</div>
            <div>
                <h1>Secure Sign In</h1>
                <p class="sub">Continue with your organization credentials.</p>
            </div>
        </div>

        <div class="glass">
            <p class="hint">What you’ll be able to do:</p>
            <ul class="list">
                <li>Upload multiple PDFs</li>
                <li>Trigger ML processing (unchanged)</li>
                <li>Track validation status</li>
            </ul>

            <div class="cta">
                <button id="loginBtn" class="btn btn-primary">Continue with Auth0</button>
                <a class="btn btn-secondary" href="/">Back to Home</a>
            </div>

            <div id="loading" class="loading">Connecting to Auth0…</div>
            <div id="error" class="error-message"></div>
        </div>

        <p class="footer">Protected by Auth0</p>
    </div>

    <!-- Auth0 SPA JS -->
    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
    <script>
        let auth0Client;
        function isGoldmanSachsEmail(email){ if(!email) return false; const e = email.toLowerCase(); return e.endsWith('@goldmansachs.com') || e.endsWith('@gs.com'); }

        const loginBtn = document.getElementById('loginBtn');
        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');

        function setLoading(state) {
            loadingEl.style.display = state ? 'block' : 'none';
            loginBtn.disabled = state;
        }

        function showError(msg) {
            errorEl.textContent = msg || 'Something went wrong.';
            errorEl.style.display = 'block';
        }

        async function initAuth0() {
            try {
                auth0Client = await window.auth0.createAuth0Client({
                    domain: 'dev-zr25lcrbfq321v7f.us.auth0.com',
                    clientId: 'koEERgWqiyyNe3Ry1QSAbLtKyahWdg2y',
                    authorizationParams: { redirect_uri: window.location.origin + '/dashboard' },
                    cacheLocation: 'localstorage'
                });

                // Returning from Auth0 callback?
                const query = window.location.search;
                if (query.includes('code=') && query.includes('state=')) {
                    setLoading(true);
                    try {
                        await auth0Client.handleRedirectCallback();
                        // Decide the destination by email domain
                        try {
                            const user = await auth0Client.getUser();
                            if (isGoldmanSachsEmail(user?.email)) {
                                window.location.href = '/employee-dashboard';
                            } else {
                                window.location.href = '/dashboard';
                            }
                        } catch(_) {
                            window.location.href = '/dashboard';
                        }
                    } catch (error) {
                        console.error('[login] Callback error:', error);
                        showError('Authentication failed. Please try again.');
                        setLoading(false);
                    }
                    return;
                }

                // Already authenticated?
                const isAuthenticated = await auth0Client.isAuthenticated();
                if (isAuthenticated) {
                    const user = await auth0Client.getUser();
                    if (isGoldmanSachsEmail(user?.email)) {
                        window.location.href = '/employee-dashboard';
                    } else {
                        window.location.href = '/dashboard';
                    }
                    return;
                }
            } catch (error) {
                console.error('[login] Init error:', error);
                showError('Unable to initialize Auth0.');
                setLoading(false);
            }
        }

        async function handleLogin() {
            try {
                setLoading(true);
                await auth0Client.loginWithRedirect({
                    authorizationParams: {
                        redirect_uri: window.location.origin + '/dashboard'
                    }
                });
            } catch (error) {
                console.error('[login] Login error:', error);
                showError('Login failed. Please try again.');
                setLoading(false);
            }
        }

        loginBtn.addEventListener('click', handleLogin);
        window.addEventListener('load', initAuth0);
    </script>
</body>
</html>
