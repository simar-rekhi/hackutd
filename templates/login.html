<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goldman Sachs Hackathon - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Auth0 SDK - uncomment and replace with your Auth0 domain when ready to integrate -->
    <!-- <script src="https://cdn.auth0.com/js/auth0-spa-js/9.x/auth0-spa-js.production.js"></script> -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            overflow: hidden;
        }

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            filter: brightness(0.6) saturate(0.9);
        }

        /* Updated overlay to lighter blue gradient */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(173, 216, 230, 0.35) 0%, rgba(135, 206, 235, 0.35) 100%);
            z-index: -1;
        }

        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        /* Improved glass-morphism with lighter blue accents */
        .login-container {
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(12px);
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(59, 130, 246, 0.12), 0 0 1px rgba(173, 216, 230, 0.3);
            border: 1px solid rgba(173, 216, 230, 0.3);
            width: 100%;
            max-width: 420px;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 32px;
            height: auto;
            margin-bottom: 32px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            /* Lighter blue heading color */
            color: #2563eb;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            /* Light blue subtitle */
            color: #0369a1;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            /* Light blue labels */
            color: #3b82f6;
            font-weight: 500;
            font-size: 14px;
        }

        /* Light blue input styling */
        input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #bfdbfe;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: rgba(240, 248, 255, 0.5);
            color: #1e40af;
        }

        input:focus {
            outline: none;
            border-color: #60a5fa;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
        }

        input::placeholder {
            color: #93c5fd;
        }

        /* Larger, more spacious buttons with better padding */
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.3px;
            margin-top: 12px;
            margin-bottom: 20px;
        }

        button:hover {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        /* Improved form footer spacing */
        .form-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #e5e7eb;
            font-size: 13px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #60a5fa;
        }

        .form-footer a {
            /* Light blue links */
            color: #2563eb;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .form-footer a:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }

        .gs-logo-text {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #e5e7eb;
        }

        /* Enhanced mobile responsiveness */
        @media (max-width: 768px) {
            .login-container {
                padding: 2.5rem;
            }

            h1 {
                font-size: 22px;
            }

            label {
                font-size: 13px;
            }

            /* Larger input on tablets */
            input {
                padding: 13px 14px;
                font-size: 16px;
            }

            /* Larger button on tablets */
            button {
                padding: 14px;
                font-size: 15px;
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 1.75rem;
                border-radius: 12px;
            }

            h1 {
                font-size: 20px;
                margin-bottom: 8px;
            }

            .subtitle {
                font-size: 13px;
                margin-bottom: 24px;
            }

            .form-group {
                margin-bottom: 22px;
            }

            /* Larger touch-friendly input on mobile */
            input {
                padding: 12px 14px;
                font-size: 16px;
            }

            /* Larger touch-friendly button on mobile */
            button {
                padding: 14px;
                font-size: 15px;
                margin-bottom: 16px;
            }

            .form-footer {
                flex-direction: column;
                align-items: flex-start;
                margin-top: 20px;
                padding-top: 20px;
                gap: 12px;
            }

            .gs-logo-text {
                font-size: 11px;
                margin-top: 24px;
                padding-top: 20px;
            }
        }

        @media (max-width: 360px) {
            .login-container {
                padding: 1.5rem;
            }

            h1 {
                font-size: 18px;
            }

            .logo {
                width: 28px;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Video Background - using valid MP4 source from Pexels that works in all browsers -->
    <video class="video-background" autoplay muted loop playsinline>
        <source src="https://videos.pexels.com/video-files/7974/7974-hd_1920_1080_25fps.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- Light Blue Overlay -->
    <div class="overlay"></div>

    <!-- Login Container -->
    <div class="login-wrapper">
        <div class="login-container">
            <!-- Goldman Sachs Logo/Text -->
            <div style="margin-bottom: 24px;">
                <svg class="logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="32" height="32" rx="4" fill="#2563eb"/>
                    <text x="50%" y="50%" font-size="14" font-weight="bold" fill="white" text-anchor="middle" dy=".3em">GS</text>
                </svg>
            </div>

            <h1>Welcome</h1>
            <p class="subtitle">Sign in to your Goldman Sachs Hackathon account</p>

            <!-- Form section - can be replaced with Auth0 login component -->
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Enter your credentials"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" id="login-button">Sign In</button>

                <div class="form-footer">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember" style="margin: 0; font-size: 13px; color: #6b7280;">Remember me</label>
                    </div>
                    <a href="#forgot">Forgot password?</a>
                </div>
            </form>

            <div class="gs-logo-text">
                <p style="font-size: 11px; color: #9ca3af; margin-bottom: 8px;">Goldman Sachs & Co. LLC</p>
                <p style="font-size: 11px; line-height: 1.4; color: #9ca3af;">
                    © 2025 Goldman Sachs. Dedicated to advancing the financial markets with integrity, innovation, and client-centered excellence.
                </p>
            </div>
        </div>
    </div>

    <script>

        //

            }

            e.preventDefault();
            await auth0Client.loginWithPopup();

        // Default form handler (remove when Auth0 is integrated)
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (username && password) {
                console.log('[v0] Login submitted - Replace with Auth0 integration');
                // Your authentication logic here
            }
        });
    </script>
</body>
</html>
