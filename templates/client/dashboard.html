<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Onboarding Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --bg:#0a1929; --panel:rgba(15,30,50,0.7); --text:#fff; --muted:rgba(255,255,255,0.6); }
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial;
      color:var(--text);background:linear-gradient(135deg,#0a1929 0%,#001e3c 50%,#0a1929 100%);min-height:100vh;padding:20px}
    .dashboard{max-width:1200px;margin:0 auto}
    .header{background:var(--panel);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);padding:20px;border-radius:16px;
      display:flex;align-items:center;justify-content:space-between;gap:12px}
    .user{display:flex;align-items:center;gap:12px}
    .avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,#4fc3f7,#007bff);font-weight:700}
    .email{color:var(--muted);font-size:14px}
    .actions{display:flex;gap:10px}
    .btn{border:1px solid rgba(255,255,255,.2);background:transparent;color:var(--text);padding:10px 16px;border-radius:10px;cursor:pointer}
    .btn.primary{border:none;background:linear-gradient(135deg,#007bff,#0056d6)}
    .card{margin-top:18px;background:var(--panel);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:18px}
    .section-title{font-weight:700;margin:0 0 10px}
    .list{margin:0;padding:0;list-style:none}
    .uploadOverlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50}
    .uploadOverlay.active{display:flex}
    .uploadArea{width:min(680px,92vw);min-height:240px;border:2px dashed rgba(255,255,255,.25);border-radius:16px;
      display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(255,255,255,.03);position:relative;cursor:pointer}
    .uploadArea.drag-over{border-color:#4fc3f7;background:rgba(79,195,247,.08)}
    .close{position:absolute;top:10px;right:10px;border:none;cursor:pointer;border-radius:999px;width:32px;height:32px;
      display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);color:#fff}
    .spinner{width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;display:inline-block;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .status{margin-top:14px;display:none;gap:6px;flex-direction:column}
    .status.active{display:flex}
    .status-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
    .status-item.success{border-color:rgba(56,142,60,.6)}
    .status-item.error{border-color:rgba(198,40,40,.7)}
    .results{display:none;margin-top:16px}
    .results.active{display:block}
    .result-item{border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:10px;margin-bottom:10px}
    .result-header{font-weight:700;margin-bottom:8px}
    table{width:100%;border-collapse:collapse}
    td{border-top:1px solid rgba(255,255,255,.08);padding:6px 4px;vertical-align:top}
    #loading{min-height:40vh;display:flex;align-items:center;justify-content:center}
  </style>
</head>
<body>
  <div id="loading"><span class="spinner"></span>&nbsp;Loading dashboard…</div>

  <div id="dash" class="dashboard" style="display:none">
    <div class="header">
      <div class="user">
        <div id="userAvatar" class="avatar">U</div>
        <div>
          <div>Welcome back!</div>
          <div id="userEmail" class="email">Loading…</div>
        </div>
      </div>
      <div class="actions">
        <button class="btn primary" onclick="toggleUpload()">Upload Documents</button>
        <button id="logoutBtn" class="btn">Logout</button>
      </div>
    </div>

    <div class="card">
      <h3 class="section-title">Results</h3>
      <div id="resultsSection" class="results">
        <div id="resultsContainer"></div>
      </div>
      <div id="processingStatus" class="status"></div>
    </div>
  </div>

  <!-- Upload overlay -->
  <div id="overlay" class="uploadOverlay">
    <div id="drop" class="uploadArea">
      <button class="close" onclick="toggleUpload()">✕</button>
      <div style="opacity:.8">Drag & drop PDFs here or click to select</div>
      <input id="fileInput" type="file" accept="application/pdf" multiple style="display:none" />
    </div>
  </div>

  <!-- Auth0 -->
  <script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
  <script>
    // ----------------- Auth0 boot -----------------
    let auth0Client;
    let currentUser = null;
    window.__userEmail = 'unknown@local';

    const loading = document.getElementById('loading');
    const dash = document.getElementById('dash');
    const logoutBtn = document.getElementById('logoutBtn');
    const userEmailEl = document.getElementById('userEmail');
    const userAvatarEl = document.getElementById('userAvatar');

    async function initAuth0() {
      try {
        auth0Client = await window.auth0.createAuth0Client({
          domain: 'dev-zr25lcrbfq321v7f.us.auth0.com',
          clientId: 'koEERgWqiyyNe3Ry1QSAbLtKyahWdg2y',
          authorizationParams: { redirect_uri: window.location.origin + '/dashboard' },
          cacheLocation: 'localstorage'
        });

        // redirect callback
        const q = window.location.search;
        if (q.includes('code=') && q.includes('state=')) {
          try {
            await auth0Client.handleRedirectCallback();
            window.history.replaceState({}, document.title, '/dashboard');
          } catch (err) { console.error('callback error', err); }
        }

        const isAuth = await auth0Client.isAuthenticated();
        if (!isAuth) { window.location.href = '/login'; return; }

        currentUser = await auth0Client.getUser();
        window.__userEmail = currentUser?.email || 'unknown@local';
        userEmailEl.textContent = currentUser?.email || currentUser?.name || 'User';
        userAvatarEl.textContent = (currentUser?.email || currentUser?.name || 'U')[0].toUpperCase();

        loading.style.display = 'none';
        dash.style.display = 'block';
      } catch (e) {
        console.error('Auth0 init failed', e);
        window.location.href = '/login';
      }
    }

    logoutBtn.addEventListener('click', async () => {
      try {
        logoutBtn.disabled = true;
        logoutBtn.innerHTML = '<span class="spinner"></span>&nbsp;Logging out…';
        await auth0Client.logout({ logoutParams: { returnTo: window.location.origin + '/login' }});
      } catch (e) {
        logoutBtn.disabled = false; logoutBtn.textContent = 'Logout';
        alert('Logout failed. Ensure Allowed Logout URLs is set in Auth0.');
      }
    });

    // ----------------- Upload UI -----------------
    const overlay = document.getElementById('overlay');
    const drop = document.getElementById('drop');
    const fileInput = document.getElementById('fileInput');
    const processingStatus = document.getElementById('processingStatus');
    const resultsSection = document.getElementById('resultsSection');
    const resultsContainer = document.getElementById('resultsContainer');

    function toggleUpload(){ overlay.classList.toggle('active'); }
    drop.addEventListener('click', (e) => { if (e.target === drop) fileInput.click(); });
    drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('drag-over'); });
    drop.addEventListener('dragleave', (e) => { e.preventDefault(); drop.classList.remove('drag-over'); });
    drop.addEventListener('drop', (e) => {
      e.preventDefault(); drop.classList.remove('drag-over'); handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

    // ----------------- Core flow (Gabe preserved) -----------------
    async function handleFiles(files) {
      const pdfFiles = Array.from(files).filter(f => f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));
      if (!pdfFiles.length) { alert('Please upload PDF files only.'); return; }

      // batch path (optional): send many PDFs in one request
      if (pdfFiles.length > 1) {
        const fd = new FormData();
        pdfFiles.forEach(f => fd.append('files', f));
        fd.append('user_email', window.__userEmail);

        processingStatus.classList.add('active');
        processingStatus.innerHTML = '';
        resultsContainer.innerHTML = '';
        resultsSection.classList.remove('active');

        const resp = await fetch('/api/process-multiple-pdfs', { method: 'POST', body: fd });
        const out = await resp.json();

        (out.results || []).forEach((r, i) => {
          const status = document.createElement('div');
          status.className = 'status-item ' + (r.success ? 'success' : 'error');
          status.innerHTML = r.success
            ? `<span>✓ ${r.filename} processed</span><span>Complete</span>`
            : `<span>✗ ${r.filename} failed</span><span>${r.error || 'Unknown error'}</span>`;
          processingStatus.appendChild(status);
          if (r.success) displayResult(r);
        });

        (out.errors || []).forEach(msg => {
          const status = document.createElement('div');
          status.className = 'status-item error';
          status.innerHTML = `<span>✗ Error</span><span>${msg}</span>`;
          processingStatus.appendChild(status);
        });

        if (resultsContainer.children.length > 0) resultsSection.classList.add('active');
        setTimeout(() => { if (resultsContainer.children.length > 0) toggleUpload(); }, 1200);
        return;
      }

      // per-file path (exactly like Gabe, just adds user_email)
      processingStatus.classList.add('active');
      processingStatus.innerHTML = '';
      resultsContainer.innerHTML = '';
      resultsSection.classList.remove('active');

      for (let i = 0; i < pdfFiles.length; i++) {
        const file = pdfFiles[i];
        const row = document.createElement('div');
        row.className = 'status-item';
        row.innerHTML = `<span><span class="spinner"></span>&nbsp;Processing ${file.name}…</span><span>Step 1: OCR extraction</span>`;
        processingStatus.appendChild(row);

        try {
          const fd = new FormData();
          fd.append('file', file);
          fd.append('user_email', window.__userEmail); // <-- key addition

          row.innerHTML = `<span><span class="spinner"></span>&nbsp;Processing ${file.name}…</span><span>Step 2: Structuring data</span>`;

          const resp = await fetch('/api/upload-pdf', { method: 'POST', body: fd });
          const res = await resp.json();

          if (resp.ok && res.success) {
            row.classList.add('success');
            row.innerHTML = `<span>✓ ${file.name} processed successfully</span><span>Complete</span>`;
            displayResult(res);
          } else {
            row.classList.add('error');
            row.innerHTML = `<span>✗ ${file.name} failed</span><span>${res.error || 'Unknown error'}</span>`;
          }
        } catch (err) {
          row.classList.add('error');
          row.innerHTML = `<span>✗ ${file.name} failed</span><span>${err.message}</span>`;
        }
      }

      if (resultsContainer.children.length > 0) resultsSection.classList.add('active');
      setTimeout(() => { if (resultsContainer.children.length > 0) toggleUpload(); }, 1200);
    }

    // Render Gabe-style result card (filename + structured_data table)
    function displayResult(result) {
      const div = document.createElement('div');
      div.className = 'result-item';
      const filename = (result.filename || 'Result').replace(/[^a-zA-Z0-9]/g, '-');
      div.id = `result-${filename}`;

      const structured = result.structured_data || {};
      const nonNull = Object.entries(structured).filter(([k, v]) => v !== null && v !== '');
      const escape = (s) => String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;');

      let rows = '';
      nonNull.forEach(([k, v]) => {
        let val = '';
        if (v === null || v === undefined) val = '';
        else if (typeof v === 'object') { try { val = JSON.stringify(v, null, 2); } catch(e) { val = String(v); } }
        else val = String(v);
        rows += `<tr><td>${escape(k)}</td><td>${escape(val)}</td></tr>`;
      });

      div.innerHTML = `
        <div class="result-header">📄 ${escape(result.filename || 'Document')}</div>
        <div class="result-data"><table>${rows}</table></div>
      `;
      resultsContainer.appendChild(div);
    }

    // Start
    window.addEventListener('load', initAuth0);
  </script>
</body>
</html>
