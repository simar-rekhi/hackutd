<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Goldman Sachs - Onboarding Dashboard</title>
  <style>
    /* --- (Gabe) styles unchanged; merged with Sneha visual --- */
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
      background: linear-gradient(135deg, #0a1929 0%, #001e3c 50%, #0a1929 100%);
      background-attachment: fixed; min-height:100vh; padding:20px; color:#fff; position:relative;
    }
    body::before {
      content:''; position:fixed; inset:0;
      background:
        radial-gradient(circle at 20% 30%, rgba(0,123,255,.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(0,102,204,.08) 0%, transparent 50%);
      pointer-events:none; animation: subtleShift 20s ease-in-out infinite;
    }
    @keyframes subtleShift { 0%{transform:translateY(0)} 50%{transform:translateY(-8px)} 100%{transform:translateY(0)} }

    /* Header / layout / cards (unchanged) */
    .container{max-width:1200px;margin:0 auto}
    .header{display:flex;align-items:center;justify-content:space-between;margin:16px 0 22px}
    .brand{display:flex;gap:12px;align-items:center}
    .brand-badge{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(145deg,#2b6cb0,#1e40af);font-weight:700}
    .user{display:flex;gap:10px;align-items:center}
    .user img{width:36px;height:36px;border-radius:50%;border:1px solid rgba(148,163,184,.3)}
    .card{background:rgba(15,23,42,.55);border:1px solid rgba(59,130,246,.25);box-shadow:0 10px 25px rgba(2,6,23,.5), inset 0 0 80px rgba(59,130,246,.06);border-radius:18px;padding:18px;backdrop-filter: blur(10px);margin-bottom:18px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .section-title{font-size:1.05rem;color:#c7d2fe;margin-bottom:8px}
    .btn{appearance:none;border:none;border-radius:10px;padding:10px 12px;font-weight:600;cursor:pointer}
    .btn-primary{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff}
    .btn-secondary{background:rgba(255,255,255,.06);color:#dbeafe;border:1px solid rgba(148,163,184,.2)}
    .hidden{display:none}

    /* Upload area (Gabe) */
    .upload-area{border:1.5px dashed rgba(148,163,184,.35);border-radius:16px;padding:22px;text-align:center;background:rgba(255,255,255,.02)}
    .upload-area.dragover{background:rgba(59,130,246,.08);border-color:#60a5fa}
    .file-list{margin-top:12px;color:#c7d2fe}
    .status-list{margin-top:10px}
    .status-item{display:flex;justify-content:space-between;align-items:center;font-size:.95rem;padding:8px 10px;border-radius:10px;background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);margin-top:8px}
    .status-item.error{background:rgba(220,38,38,.14);border-color:rgba(220,38,38,.35);color:#fecaca}

    /* Result view, modal, etc. remain unchanged ... */
    .result{margin-top:14px;color:#e0e7ff;white-space:pre-wrap}
    .tickets{list-style:none;margin-top:12px}
    .tickets li{padding:10px;border:1px solid rgba(148,163,184,.2);border-radius:10px;margin-bottom:8px;background:rgba(255,255,255,.03)}
    .modal{position:fixed;inset:0;background:rgba(2,6,23,.6);display:none;align-items:center;justify-content:center}
    .modal .panel{background:#0b1326;border:1px solid rgba(59,130,246,.25);border-radius:16px;padding:16px;width:min(520px,96vw)}
    .modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <div class="brand-badge">GS</div>
        <div>
          <div style="font-weight:700">Onboarding</div>
          <div style="font-size:.9rem;color:#a5b4fc">Upload & validation</div>
        </div>
      </div>
      <div class="user">
        <span id="userEmail" style="color:#c7d2fe"></span>
        <img id="userAvatar" src="" alt="avatar"/>
        <button id="logout-btn" class="btn btn-secondary">Logout</button>
      </div>
    </header>

    <div id="loadingScreen" class="card">Loading your dashboard…</div>

    <div id="dashboardContent" class="hidden">
      <section class="grid">
        <div class="card">
          <div class="section-title">Upload PDFs</div>
          <div id="uploadArea" class="upload-area">
            <p>Drag & drop files here or</p>
            <button id="browseBtn" class="btn btn-primary" type="button">Browse</button>
            <input id="fileInput" type="file" accept="application/pdf" multiple style="display:none"/>
            <div id="fileList" class="file-list"></div>
          </div>
          <div id="statusList" class="status-list"></div>
        </div>

        <div class="card">
          <div class="section-title">Result</div>
          <pre id="resultView" class="result">No results yet.</pre>
          <ul id="tickets" class="tickets"></ul>
        </div>
      </section>
    </div>

    <!-- Missing data modal (Gabe flow preserved) -->
    <div id="missingDataOverlay" class="modal">
      <div class="panel">
        <h3>We need a couple more details</h3>
        <p style="color:#c7d2fe;margin-top:6px">Fill these to continue.</p>
        <form id="missingDataForm" style="margin-top:10px">
          <div id="missingFieldsContainer"></div>
          <div class="row">
            <button type="button" class="btn btn-secondary" onclick="closeMissingDataModal()">Cancel</button>
            <button type="submit" class="btn btn-primary">Save & Continue</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Auth0 -->
  <script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
  <script>
    let auth0Client, currentUser = null;

    function isGoldmanSachsEmail(email){ if(!email) return false; const e = email.toLowerCase(); return e.endsWith('@goldmansachs.com') || e.endsWith('@gs.com'); }

    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const logoutBtn = document.getElementById('logout-btn');
    const loadingScreen = document.getElementById('loadingScreen');
    const dashboardContent = document.getElementById('dashboardContent');
    const ticketsEl = document.getElementById('tickets');
    const resultView = document.getElementById('resultView');

    async function initAuth0() {
      try {
        auth0Client = await window.auth0.createAuth0Client({
          domain: 'dev-zr25lcrbfq321v7f.us.auth0.com',
          clientId: 'koEERgWqiyyNe3Ry1QSAbLtKyahWdg2y',
          authorizationParams: { redirect_uri: window.location.origin + '/dashboard' },
          cacheLocation: 'localstorage'
        });

        // If returned from Auth0
        const query = window.location.search;
        if (query.includes('code=') && query.includes('state=')) {
          await auth0Client.handleRedirectCallback();
          history.replaceState({}, document.title, '/dashboard');
        }

        const isAuth = await auth0Client.isAuthenticated();
        if (!isAuth) { window.location.href = '/login'; return; }

        currentUser = await auth0Client.getUser();
        displayUserInfo(currentUser);

        // Route GS employees to their dashboard
        if (isGoldmanSachsEmail(currentUser?.email)) {
          window.location.replace('/employee-dashboard');
          return;
        }

        loadingScreen.style.display = 'none';
        dashboardContent.classList.remove('hidden');

        // Load user docs into the ticket list (Gabe)
        await loadUserDocuments();
      } catch (e) {
        console.error('Auth0 init error:', e);
        window.location.href = '/login';
      }
    }

    function displayUserInfo(user) {
      const userEmail = document.getElementById('userEmail');
      const userAvatar = document.getElementById('userAvatar');
      userEmail.textContent = user?.email || 'Unknown';
      userAvatar.src = user?.picture || 'https://i.pravatar.cc/100?img=5';
    }

    // ======= Upload & ML processing (Gabe preserved) =======
    document.getElementById('browseBtn').addEventListener('click', () => fileInput.click());
    uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
    uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
    uploadArea.addEventListener('drop', (e) => { e.preventDefault(); uploadArea.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

    async function handleFiles(fileList) {
      const files = Array.from(fileList || []);
      if (!files.length) return;
      const statusList = document.getElementById('statusList');

      for (const file of files) {
        const statusItem = document.createElement('div');
        statusItem.className = 'status-item';
        statusItem.innerHTML = `<span>Processing ${file.name}</span><span>Uploading…</span>`;
        statusList.appendChild(statusItem);

        try {
          // (1) Gabe: ML pipeline endpoint
          const form = new FormData();
          form.append('file', file);
          const res = await fetch('/api/process-pdf', { method: 'POST', body: form });
          const result = await res.json();

          if (res.ok) {
            statusItem.innerHTML = `<span>✓ ${file.name} processed successfully</span><span>Complete</span>`;
            displayResult(result);
            await checkCompletenessAndProceed(result);
          } else {
            statusItem.className = 'status-item error';
            statusItem.innerHTML = `<span>✗ ${file.name} failed</span><span>${result.error || 'Unknown error'}</span>`;
          }

          // (2) Sneha/Local: store original file by account
          if (currentUser && currentUser.email) {
            await uploadOriginalForAccount(file);
          }
        } catch (err) {
          statusItem.className = 'status-item error';
          statusItem.innerHTML = `<span>✗ ${file.name} failed</span><span>${err?.message || err || 'Error'}</span>`;
        }
      }
    }

    function displayResult(result) {
      resultView.textContent = JSON.stringify(result, null, 2);
      // Also render tickets/entries if your backend returns them (Gabe kept)
      if (Array.isArray(result?.tickets)) {
        ticketsEl.innerHTML = '';
        for (const t of result.tickets) {
          const li = document.createElement('li');
          li.textContent = `${t.id}: ${t.title} — ${t.status}`;
          ticketsEl.appendChild(li);
        }
      }
    }

    async function checkCompletenessAndProceed(result) {
      if (!result?.missing_fields || !result.missing_fields.length) return;
      openMissingDataModal(result.missing_fields, result);
    }

    // ======= Missing data modal (Gabe preserved) =======
    function openMissingDataModal(missingFields, result) {
      const overlay = document.getElementById('missingDataOverlay');
      const container = document.getElementById('missingFieldsContainer');
      container.innerHTML = '';
      missingFields.forEach(field => {
        const group = document.createElement('div'); group.className = 'missing-field-group';
        const label = document.createElement('label');
        label.textContent = field.replace(/_/g,' ').replace(/\b\w/g, l => l.toUpperCase());
        label.setAttribute('for', `field-${field}`);
        let input;
        if (field === 'registered_address') { input = document.createElement('textarea'); input.rows = 3; }
        else { input = document.createElement('input'); if (field==='email') input.type='email'; else if (field==='contact_phone') input.type='tel'; }
        input.id = `field-${field}`; input.name = field; input.required = true; input.placeholder = `Enter ${field.replace(/_/g,' ')}`;
        group.appendChild(label); group.appendChild(input); container.appendChild(group);
      });
      overlay.style.display = 'flex';

      const form = document.getElementById('missingDataForm');
      form.onsubmit = async (e) => {
        e.preventDefault();
        const formData = new FormData(form);
        const payload = {};
        formData.forEach((v,k)=>payload[k]=v);
        overlay.style.display = 'none';

        // Send to Gabe endpoint to update client data
        try {
          const res = await fetch('/api/update-client-data', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ user_email: currentUser?.email, update: payload })
          });
          const json = await res.json();
          if (!res.ok) throw new Error(json?.error || 'Update failed');
          // success path can re-check state or continue flow
        } catch (err) {
          alert('Update failed: ' + (err?.message || err));
        }
      };
    }

    function closeMissingDataModal() {
      document.getElementById('missingDataOverlay').style.display = 'none';
    }

    // ======= Sneha: store originals under user folder (local or cloud) =======
    async function uploadOriginalForAccount(file) {
      const form = new FormData();
      form.append('file', file);
      form.append('user_email', currentUser?.email || '');
      await fetch('/api/upload-original', { method: 'POST', body: form });
    }

    async function loadUserDocuments() {
      try {
        const res = await fetch(`/api/documents/${encodeURIComponent(currentUser.email)}`);
        const data = await res.json();
        if (Array.isArray(data?.documents)) {
          ticketsEl.innerHTML = '';
          data.documents.forEach(d => {
            const li = document.createElement('li');
            li.textContent = `${d.filename} — ${d.status || 'uploaded'}`;
            ticketsEl.appendChild(li);
          });
        }
      } catch (e) { console.warn('loadUserDocuments error', e); }
    }

    // ======= Logout =======
    logoutBtn.addEventListener('click', async () => {
      await auth0Client.logout({ logoutParams: { returnTo: window.location.origin + '/login' }});
    });

    // Init
    window.addEventListener('load', initAuth0);
  </script>
</body>
</html>
