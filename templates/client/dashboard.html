<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Goldman Sachs - Onboarding Dashboard</title>
  <style>
    /* --- (Gabe) styles unchanged; merged with Sneha visual --- */
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
      background: linear-gradient(135deg, #0a1929 0%, #001e3c 50%, #0a1929 100%);
      background-attachment: fixed; min-height:100vh; padding:20px; color:#fff; position:relative;
    }
    body::before {
      content:''; position:fixed; inset:0;
      background:
        radial-gradient(circle at 20% 30%, rgba(0,123,255,.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(0,102,204,.08) 0%, transparent 50%);
      pointer-events:none; animation: subtleShift 20s ease-in-out infinite;
    }
    @keyframes subtleShift { 0%,100%{opacity:.6;transform:scale(1) rotate(0)} 50%{opacity:.9;transform:scale(1.1) rotate(2deg)} }
    .dashboard-container { max-width:1200px; margin:0 auto; position:relative; z-index:1; }
    .header {
      background: rgba(15,30,50,.7); backdrop-filter: blur(20px);
      border:1px solid rgba(255,255,255,.1); padding:24px 32px; border-radius:20px;
      box-shadow:0 10px 40px rgba(0,0,0,.3); margin-bottom:24px;
      display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;
    }
    .header-left { display:flex; align-items:center; gap:16px; }
    .user-avatar { width:48px; height:48px; background:linear-gradient(135deg,#4fc3f7,#007bff); border-radius:50%;
      display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:20px; box-shadow:0 4px 15px rgba(79,195,247,.4); }
    .user-info h1 { color:#fff; font-size:24px; font-weight:700; letter-spacing:-.02em; }
    .user-email { color:rgba(255,255,255,.6); font-size:14px; margin-top:2px; }
    .header-actions { display:flex; gap:12px; }
    .btn { padding:12px 24px; border:none; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; transition: all .3s cubic-bezier(.4,0,.2,1); }
    .btn-primary { background: linear-gradient(135deg,#007bff 0%,#0056d6 100%); color:#fff; box-shadow:0 4px 15px rgba(0,123,255,.3); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow:0 8px 25px rgba(0,123,255,.5); }
    .btn-secondary { background: transparent; color: rgba(255,255,255,.8); border:1px solid rgba(255,255,255,.2); }
    .btn-secondary:hover { border-color: rgba(255,255,255,.4); background: rgba(255,255,255,.05); }
    .btn:disabled { opacity:.6; cursor:not-allowed; }

    .content-card { background: rgba(15,30,50,.7); backdrop-filter: blur(20px);
      border:1px solid rgba(255,255,255,.1); padding:32px; border-radius:20px; box-shadow:0 10px 40px rgba(0,0,0,.3); }
    .section-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
    h2 { color:#fff; font-size:22px; font-weight:700; letter-spacing:-.02em; }
    .gradient-accent { background: linear-gradient(135deg,#4fc3f7 0%,#007bff 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }

    .ticket-list { list-style:none; }
    .ticket-item { padding:20px; border-bottom:1px solid rgba(255,255,255,.08); display:flex; justify-content:space-between; align-items:center; transition:.3s; border-radius:10px; }
    .ticket-item:hover { background: rgba(255,255,255,.03); transform: translateX(4px); }
    .ticket-item:last-child { border-bottom:none; }
    .ticket-number { font-weight:600; color:#4fc3f7; font-size:16px; }
    .ticket-date { color:rgba(255,255,255,.5); font-size:14px; }

    .upload-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.8); backdrop-filter: blur(10px); z-index:1000; justify-content:center; align-items:center; }
    .upload-overlay.active { display:flex; }
    .upload-area { background: rgba(15,30,50,.9); backdrop-filter: blur(20px); border:2px dashed rgba(79,195,247,.5);
      border-radius:20px; padding:60px 40px; text-align:center; max-width:500px; width:90%; position:relative; transition:.3s; box-shadow:0 20px 60px rgba(0,0,0,.5); }
    .upload-area.drag-over { border-color:#4fc3f7; background: rgba(79,195,247,.1); transform: scale(1.02); }
    .close-button { position:absolute; top:15px; right:15px; background: rgba(255,255,255,.1); border:none; width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:20px; color:rgba(255,255,255,.7); display:flex; align-items:center; justify-content:center; transition:.3s; }
    .close-button:hover { background: rgba(255,255,255,.2); color:#fff; }
    .upload-icon { font-size:64px; margin-bottom:20px; }
    .upload-text { color:#fff; font-size:18px; margin-bottom:10px; font-weight:600; }
    .upload-hint { color:rgba(255,255,255,.5); font-size:14px; }
    .file-input { display:none; }

    .loading-screen { display:flex; justify-content:center; align-items:center; min-height:100vh; color:#4fc3f7; font-size:18px; }

    @media (max-width:768px){ .header{flex-direction:column; align-items:flex-start;} .header-actions{width:100%;} .btn{flex:1;} }

    /* (Gabe) processing UI */
    .processing-status { margin-top:20px; padding:15px; background:#f8f9ff; border-radius:8px; display:none; color:#000; }
    .processing-status.active { display:block; }
    .status-item { padding:10px; margin:5px 0; background:#fff; border-radius:5px; display:flex; justify-content:space-between; align-items:center; }
    .status-item.processing { border-left:4px solid #667eea; }
    .status-item.success { border-left:4px solid #4caf50; }
    .status-item.error { border-left:4px solid #f44336; }

    .results-section { margin-top:30px; background:#fff; color:#000; padding:30px; border-radius:10px; box-shadow:0 4px 15px rgba(0,0,0,.1); display:none; }
    .results-section.active { display:block; }
    .result-item { margin-bottom:20px; padding:15px; background:#f8f9ff; border-radius:8px; }
    .result-header { font-weight:bold; color:#667eea; margin-bottom:10px; }
    .result-data table { width:100%; border-collapse:collapse; margin-top:10px; }
    .result-data td { padding:8px; border-bottom:1px solid #eee; }
    .result-data td:first-child { font-weight:bold; width:200px; }

    /* Missing data modal (Gabe) */
    .missing-data-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.8); backdrop-filter:blur(10px); z-index:2000; justify-content:center; align-items:center; }
    .missing-data-overlay.active { display:flex; }
    .missing-data-modal { background: rgba(15,30,50,.95); backdrop-filter: blur(20px); border:1px solid rgba(255,255,255,.1); border-radius:20px; padding:40px; max-width:600px; width:90%; max-height:80vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.5); }
    .missing-data-modal h2 { color:#fff; margin-bottom:20px; font-size:24px; }
    .missing-data-modal p { color:rgba(255,255,255,.7); margin-bottom:25px; }
    .missing-field-group { margin-bottom:20px; }
    .missing-field-group label { display:block; color:#fff; margin-bottom:8px; font-weight:600; }
    .missing-field-group input,.missing-field-group textarea {
      width:100%; padding:12px; border:1px solid rgba(255,255,255,.2); border-radius:8px; background:rgba(255,255,255,.05); color:#fff; font-size:14px;
    }
    .missing-field-group textarea { min-height:80px; resize:vertical; }
    .missing-field-group input:focus,.missing-field-group textarea:focus { outline:none; border-color:#4fc3f7; background:rgba(255,255,255,.08); }
    .modal-actions { display:flex; gap:12px; margin-top:30px; }
  </style>
</head>
<body>
  <div id="loading" class="loading-screen">
    <div><span class="spinner" style="border-color:#4fc3f7;border-top-color:transparent;width:24px;height:24px;"></span> Loading dashboard...</div>
  </div>

  <div id="dashboard" class="dashboard-container" style="display:none;">
    <div class="header">
      <div class="header-left">
        <div class="user-avatar" id="userAvatar"></div>
        <div class="user-info">
          <h1>Welcome back!</h1>
          <div class="user-email" id="userEmail">Loading...</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-primary" onclick="toggleUploadArea()">Upload Documents</button>
        <button class="btn btn-secondary" id="logout-btn">Logout</button>
      </div>
    </div>

    <div class="content-card">
      <div class="section-header">
        <h2>Your <span class="gradient-accent">Onboarding Requests</span></h2>
      </div>
      <ul class="ticket-list" id="ticketList">
        <!-- Populated from /api/documents/<email> -->
      </ul>

      <!-- (Gabe) processing status box -->
      <div class="processing-status" id="processingStatus"></div>
    </div>
  </div>

  <div class="upload-overlay" id="uploadOverlay">
    <div class="upload-area" id="uploadArea">
      <button class="close-button" onclick="toggleUploadArea()">×</button>
      <div class="upload-icon">📄</div>
      <div class="upload-text">Drag and drop compliance documents here</div>
      <div class="upload-hint">or click to browse (PDF, DOCX, Excel)</div>
      <input type="file" id="fileInput" class="file-input" accept=".pdf,.docx,.xlsx" multiple>
    </div>
  </div>

  <div class="results-section" id="resultsSection">
    <h2 class="tickets-header">Extracted Data Results</h2>
    <div id="resultsContainer"></div>
  </div>

  <!-- Missing Data Modal (Gabe) -->
  <div class="missing-data-overlay" id="missingDataOverlay">
    <div class="missing-data-modal">
      <h2>Complete Missing Information</h2>
      <p>Please provide the following required fields to proceed with validation:</p>
      <form id="missingDataForm">
        <div id="missingFieldsContainer"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeMissingDataModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save & Continue</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Auth0 -->
  <script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
  <script>
    let auth0Client, currentUser = null;

    const uploadOverlay = document.getElementById('uploadOverlay');
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const logoutBtn = document.getElementById('logout-btn');
    const loadingScreen = document.getElementById('loading');
    const dashboardContent = document.getElementById('dashboard');
    const ticketList = document.getElementById('ticketList');

    // (Gabe)
    const processingStatus = document.getElementById('processingStatus');
    const resultsSection = document.getElementById('resultsSection');
    const resultsContainer = document.getElementById('resultsContainer');
    let currentResultData = {};

    async function initAuth0() {
      try {
        auth0Client = await window.auth0.createAuth0Client({
          domain: 'dev-zr25lcrbfq321v7f.us.auth0.com',
          clientId: 'koEERgWqiyyNe3Ry1QSAbLtKyahWdg2y',
          authorizationParams: { redirect_uri: window.location.origin + '/dashboard' },
          cacheLocation: 'localstorage'
        });

        const query = window.location.search;
        if (query.includes('code=') && query.includes('state=')) {
          try {
            await auth0Client.handleRedirectCallback();
            window.history.replaceState({}, document.title, '/dashboard');
          } catch (err) { console.error('Auth0 callback error:', err); }
        }

        const isAuth = await auth0Client.isAuthenticated();
        if (!isAuth) { window.location.href = '/login'; return; }

        currentUser = await auth0Client.getUser();
        displayUserInfo(currentUser);

        loadingScreen.style.display = 'none';
        dashboardContent.style.display = 'block';

        // Load user docs into the ticket list
        await loadUserDocuments();
      } catch (e) {
        console.error('Auth0 init error:', e);
        window.location.href = '/login';
      }
    }

    function displayUserInfo(user) {
      const userEmail = document.getElementById('userEmail');
      const userAvatar = document.getElementById('userAvatar');
      if (user) {
        userEmail.textContent = user.email || user.name || 'User';
        const initial = (user.email || user.name || 'U')[0].toUpperCase();
        userAvatar.textContent = initial;
      }
    }

    async function handleLogout() {
      try {
        logoutBtn.disabled = true;
        logoutBtn.textContent = 'Logging out...';
        await auth0Client.logout({ logoutParams: { returnTo: window.location.origin + '/login' }});
      } catch (e) {
        alert('Logout failed. Ensure Allowed Logout URLs includes /login.');
        logoutBtn.disabled = false; logoutBtn.textContent = 'Logout';
      }
    }

    function toggleUploadArea(){ uploadOverlay.classList.toggle('active'); }

    // Overlay interactions
    uploadOverlay.addEventListener('click', (e) => { if (e.target === uploadOverlay) toggleUploadArea(); });
    uploadArea.addEventListener('click', (e) => { if (e.target !== uploadArea.querySelector('.close-button')) fileInput.click(); });
    uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('drag-over'); });
    uploadArea.addEventListener('dragleave', (e) => { e.preventDefault(); uploadArea.classList.remove('drag-over'); });
    uploadArea.addEventListener('drop', (e) => { e.preventDefault(); uploadArea.classList.remove('drag-over'); handleFiles(e.dataTransfer.files); });
    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
    logoutBtn.addEventListener('click', handleLogout);

    async function handleFiles(files) {
      const arr = Array.from(files);
      const pdfs = arr.filter(f => f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));
      if (pdfs.length === 0) { alert('Please upload PDF files for processing.'); return; }

      processingStatus.classList.add('active');
      processingStatus.innerHTML = '';
      resultsContainer.innerHTML = '';
      resultsSection.classList.remove('active');

      for (let i = 0; i < pdfs.length; i++) {
        const file = pdfs[i];
        const statusItem = document.createElement('div');
        statusItem.className = 'status-item processing';
        statusItem.id = `status-${i}`;
        statusItem.innerHTML = `<span><span class="spinner"></span>Processing ${file.name}...</span><span>OCR & Structuring</span>`;
        processingStatus.appendChild(statusItem);

        try {
          // (1) Gabe: process PDF
          const fdProcess = new FormData();
          fdProcess.append('file', file);
          const res = await fetch('/api/upload-pdf', { method: 'POST', body: fdProcess });
          const result = await res.json();

          if (res.ok && result.success) {
            statusItem.className = 'status-item success';
            statusItem.innerHTML = `<span>✓ ${file.name} processed successfully</span><span>Complete</span>`;
            displayResult(result);
            await checkCompletenessAndProceed(result);
          } else {
            statusItem.className = 'status-item error';
            statusItem.innerHTML = `<span>✗ ${file.name} failed</span><span>${result.error || 'Unknown error'}</span>`;
          }

          // (2) Sneha/Local: store original file (always store locally; Firestore/GCS if configured)
          if (currentUser && currentUser.email) {
            await uploadOriginalForAccount(file);
          }
        } catch (err) {
          statusItem.className = 'status-item error';
          statusItem.innerHTML = `<span>✗ ${file.name} failed</span><span>${err.message}</span>`;
        }
      }

      if (resultsContainer.children.length > 0) { resultsSection.classList.add('active'); }
      setTimeout(() => toggleUploadArea(), 600);

      // Refresh user docs list after storing
      await loadUserDocuments();
    }

    async function uploadOriginalForAccount(file) {
      try {
        const fd = new FormData();
        fd.append('file', file);
        fd.append('user_email', currentUser.email);
        const resp = await fetch('/api/upload', { method: 'POST', body: fd });
        const data = await resp.json();
        if (!resp.ok) {
          console.error('Store error:', data.error);
        }
      } catch (e) {
        console.error('Store error:', e);
      }
    }

    async function loadUserDocuments() {
      try {
        if (!currentUser || !currentUser.email) return;
        const resp = await fetch(`/api/documents/${encodeURIComponent(currentUser.email)}`);
        const data = await resp.json();
        if (resp.ok && data.documents) {
          displayDocuments(data.documents);
        } else {
          ticketList.innerHTML = '<li class="ticket-item"><span>Unable to load documents</span></li>';
        }
      } catch (e) {
        console.error('loadUserDocuments error:', e);
        ticketList.innerHTML = '<li class="ticket-item"><span>Error loading documents</span></li>';
      }
    }

    function displayDocuments(documents) {
      if (!documents || documents.length === 0) {
        ticketList.innerHTML = '<li class="ticket-item"><span>No documents uploaded yet</span></li>';
        return;
      }
      ticketList.innerHTML = documents.map(doc => {
        const date = doc.upload_date ? new Date(doc.upload_date._seconds * 1000).toLocaleDateString() : 'N/A';
        const name = doc.filename || 'Document';
        return `<li class="ticket-item"><span class="ticket-number">${name}</span><span class="ticket-date">Uploaded: ${date}</span></li>`;
      }).join('');
    }

    // ==== (Gabe) Results + Missing Data flow ====
    function displayResult(result) {
      const div = document.createElement('div');
      div.className = 'result-item';
      div.id = `result-${result.filename.replace(/[^a-zA-Z0-9]/g, '-')}`;

      const structured = result.structured_data || {};
      const nonNull = Object.entries(structured).filter(([_, v]) => v !== null && v !== '');

      const esc = s => String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const fmt = v => (v && typeof v === 'object') ? esc(JSON.stringify(v, null, 2)) : esc(v ?? '');

      let rows = '<table>';
      nonNull.forEach(([k,v]) => rows += `<tr><td>${esc(k)}</td><td>${fmt(v)}</td></tr>`);
      rows += '</table>';

      div.innerHTML = `<div class="result-header">📄 ${result.filename}</div><div class="result-data">${rows}</div>`;
      resultsContainer.appendChild(div);
      currentResultData[result.filename] = result;
    }

    async function checkCompletenessAndProceed(result) {
      try {
        const resp = await fetch('/api/check-completeness', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ structured_data: result.structured_data })
        });
        const comp = await resp.json();
        if (comp.success) {
          const saveResp = await fetch('/api/save-client-data', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ structured_data: result.structured_data, filename: result.filename })
          });
          const saveRes = await saveResp.json();
          if (saveRes.success) {
            result.client_data_id = saveRes.client_data_id;
            currentResultData[result.filename] = result;
            if (!comp.complete) {
              showMissingDataModal(comp.missing_fields, result);
            }
          }
        }
      } catch (e) { console.error('checkCompletenessAndProceed error:', e); }
    }

    function showMissingDataModal(missingFields, result) {
      const overlay = document.getElementById('missingDataOverlay');
      const container = document.getElementById('missingFieldsContainer');
      container.innerHTML = '';
      missingFields.forEach(field => {
        const group = document.createElement('div'); group.className = 'missing-field-group';
        const label = document.createElement('label');
        label.textContent = field.replace(/_/g,' ').replace(/\b\w/g, l => l.toUpperCase());
        label.setAttribute('for', `field-${field}`);
        let input;
        if (field === 'registered_address') { input = document.createElement('textarea'); input.rows = 3; }
        else { input = document.createElement('input'); if (field==='contact_email') input.type='email'; else if (field==='contact_phone') input.type='tel'; }
        input.id = `field-${field}`; input.name = field; input.required = true; input.placeholder = `Enter ${field.replace(/_/g,' ')}`;
        group.appendChild(label); group.appendChild(input); container.appendChild(group);
      });
      const form = document.getElementById('missingDataForm');
      form.dataset.clientDataId = result.client_data_id;
      form.dataset.filename = result.filename;
      overlay.classList.add('active');
    }

    function closeMissingDataModal(){ document.getElementById('missingDataOverlay').classList.remove('active'); }

    document.getElementById('missingDataOverlay').addEventListener('click',(e)=>{ if(e.target.id==='missingDataOverlay') closeMissingDataModal(); });

    document.getElementById('missingDataForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const form = e.target;
      const clientDataId = form.dataset.clientDataId;
      const filename = form.dataset.filename;
      const fd = new FormData(form);
      const updates = {};
      for (const [k,v] of fd.entries()) updates[k] = v.trim();

      try {
        const resp = await fetch('/api/update-client-data', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ client_data_id: clientDataId, updates })
        });
        const res = await resp.json();
        if (res.success) {
          if (res.complete) {
            closeMissingDataModal();
            if (currentResultData[filename]) currentResultData[filename].client_data_id = clientDataId;
            alert('Data updated successfully! You can now proceed with validation.');
          } else {
            alert('Some fields are still missing. Please fill all required fields.');
            showMissingDataModal(res.missing_fields, { client_data_id: clientDataId, filename });
          }
        } else {
          alert('Failed to update data: ' + (res.error || 'Unknown error'));
        }
      } catch (err) {
        console.error('update-client-data error:', err);
        alert('An error occurred while updating data.');
      }
    });

    // Init
    window.addEventListener('load', initAuth0);
  </script>
</body>
</html>
