<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: #333;
            font-size: 28px;
        }

        .upload-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .upload-button:hover {
            opacity: 0.9;
        }

        .upload-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .upload-overlay.active {
            display: flex;
        }

        .upload-area {
            background: white;
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 60px 40px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            position: relative;
            transition: all 0.3s;
        }

        .upload-area.drag-over {
            border-color: #764ba2;
            background: #f0f2ff;
            transform: scale(1.02);
        }

        .close-button {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #f0f0f0;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-button:hover {
            background: #e0e0e0;
        }

        .tickets-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .tickets-header {
            margin-bottom: 20px;
            color: #333;
            font-size: 22px;
        }

        .ticket-list {
            list-style: none;
        }

        .ticket-item {
            padding: 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .ticket-item:hover {
            background: #f8f9ff;
        }

        .ticket-item:last-child {
            border-bottom: none;
        }

        .ticket-number {
            font-weight: bold;
            color: #667eea;
            font-size: 16px;
        }

        .ticket-date {
            color: #888;
            font-size: 14px;
        }

        .upload-icon {
            font-size: 64px;
            color: #667eea;
            margin-bottom: 20px;
        }

        .upload-text {
            color: #555;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .upload-hint {
            color: #888;
            font-size: 14px;
        }

        .file-input {
            display: none;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="header">
            <h1>Client Dashboard</h1>
            <button class="upload-button" onclick="toggleUploadArea()">Upload Identifying Information</button>
        </div>

        <div class="content-card">
            <div class="section-header">
                <h2>Your <span class="gradient-accent">Onboarding Requests</span></h2>
            </div>
            <ul class="ticket-list">
                <!-- Documents will be loaded here -->
            </ul>
        </div>
    </div>

    <div class="upload-overlay" id="uploadOverlay">
        <div class="upload-area" id="uploadArea">
            <button class="close-button" onclick="toggleUploadArea()">×</button>
            <div class="upload-icon">📄</div>
            <div class="upload-text">Drag and drop PDF files here</div>
            <div class="upload-hint">or click to browse</div>
            <input type="file" id="fileInput" class="file-input" accept=".pdf" multiple>
        </div>
    </div>

    <script>
        console.log("[v0] Dashboard - Initializing Auth0...");
        
        let auth0Client;
        let currentUser = null;
        const uploadOverlay = document.getElementById('uploadOverlay');
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const logoutBtn = document.getElementById('logout-btn');
        const loadingScreen = document.getElementById('loading');
        const dashboardContent = document.getElementById('dashboard');

        async function initAuth0() {
            try {
                console.log("[v0] Creating Auth0 client...");
                
                auth0Client = await window.auth0.createAuth0Client({
                    domain: 'dev-zr25lcrbfq321v7f.us.auth0.com',
                    clientId: 'koEERgWqiyyNe3Ry1QSAbLtKyahWdg2y',
                    authorizationParams: {
                        redirect_uri: window.location.origin + '/dashboard'
                    },
                    cacheLocation: 'localstorage'
                });

                console.log("[v0] Auth0 client initialized");

                // Handle redirect callback
                const query = window.location.search;
                if (query.includes('code=') && query.includes('state=')) {
                    console.log("[v0] Handling redirect callback...");
                    try {
                        await auth0Client.handleRedirectCallback();
                        window.history.replaceState({}, document.title, '/dashboard');
                        console.log("[v0] Callback handled successfully");
                    } catch (error) {
                        console.error('[v0] Callback error:', error);
                    }
                }

                // Check authentication
                const isAuthenticated = await auth0Client.isAuthenticated();
                console.log("[v0] Is authenticated:", isAuthenticated);
                
                if (!isAuthenticated) {
                    console.log("[v0] Not authenticated, redirecting to login");
                    window.location.href = '/login';
                    return;
                }

                // Get user info
                const user = await auth0Client.getUser();
                console.log("[v0] User info retrieved:", user?.email);
                currentUser = user;
                displayUserInfo(user);

                // Show dashboard
                loadingScreen.style.display = 'none';
                dashboardContent.style.display = 'block';

                loadUserDocuments();

            } catch (error) {
                console.error('[v0] Auth0 initialization error:', error);
                window.location.href = '/login';
            }
        }

        function displayUserInfo(user) {
            const userEmail = document.getElementById('userEmail');
            const userAvatar = document.getElementById('userAvatar');

            if (user) {
                userEmail.textContent = user.email || user.name || 'User';
                
                // Set avatar with first letter of email
                const initial = (user.email || user.name || 'U')[0].toUpperCase();
                userAvatar.textContent = initial;
            }
        }

        async function handleLogout() {
            try {
                console.log("[v0] Logout button clicked");
                logoutBtn.disabled = true;
                logoutBtn.innerHTML = '<span class="spinner"></span>Logging out...';
                
                console.log("[v0] Calling Auth0 logout...");
                await auth0Client.logout({
                    logoutParams: {
                        returnTo: window.location.origin + '/login'
                    }
                });
            } catch (error) {
                console.error('[v0] Logout error:', error);
                alert('Logout failed. Please ensure "' + window.location.origin + '/login" is added to your Auth0 Allowed Logout URLs.');
                logoutBtn.disabled = false;
                logoutBtn.textContent = 'Logout';
            }
        }

        function toggleUploadArea() {
            uploadOverlay.classList.toggle('active');
        }

        // Close overlay when clicking outside
        uploadOverlay.addEventListener('click', (e) => {
            if (e.target === uploadOverlay) {
                toggleUploadArea();
            }
        });

        // Click to browse
        uploadArea.addEventListener('click', (e) => {
            if (e.target !== uploadArea.querySelector('.close-button')) {
                fileInput.click();
            }
        });

        // Drag and drop events
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.add('drag-over');
        });

        uploadArea.addEventListener('dragleave', (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.remove('drag-over');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.remove('drag-over');
            handleFiles(e.dataTransfer.files);
        });

        // File input change
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        async function handleFiles(files) {
            const pdfFiles = Array.from(files).filter(file => 
                file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')
            );
            
            if (pdfFiles.length === 0) {
                alert('Please upload PDF files only.');
                return;
            }

            // Upload each file
            for (const file of pdfFiles) {
                await uploadFile(file);
            }

            toggleUploadArea();
            loadUserDocuments(); // Refresh document list
        }

        async function uploadFile(file) {
            try {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('user_email', currentUser.email);

                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    console.log('File uploaded successfully:', data);
                    alert(`Successfully uploaded: ${file.name}`);
                } else {
                    console.error('Upload error:', data.error);
                    alert(`Failed to upload ${file.name}: ${data.error}`);
                }
            } catch (error) {
                console.error('Upload error:', error);
                alert(`Error uploading ${file.name}`);
            }
        }

        async function loadUserDocuments() {
            try {
                if (!currentUser || !currentUser.email) return;

                const response = await fetch(`/api/documents/${encodeURIComponent(currentUser.email)}`);
                const data = await response.json();

                if (response.ok && data.documents) {
                    displayDocuments(data.documents);
                }
            } catch (error) {
                console.error('Error loading documents:', error);
            }
        }

        function displayDocuments(documents) {
            const ticketList = document.querySelector('.ticket-list');
            
            if (documents.length === 0) {
                ticketList.innerHTML = '<li class="ticket-item"><span>No documents uploaded yet</span></li>';
                return;
            }

            ticketList.innerHTML = documents.map((doc, index) => {
                const date = doc.upload_date ? new Date(doc.upload_date._seconds * 1000).toLocaleDateString() : 'N/A';
                return `
                    <li class="ticket-item">
                        <span class="ticket-number">${doc.filename}</span>
                        <span class="ticket-date">Uploaded: ${date}</span>
                    </li>
                `;
            }).join('');
        }

        // Initialize
        logoutBtn.addEventListener('click', handleLogout);
        window.addEventListener('load', initAuth0);
    </script>
</body>
</html>
